<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleeping Dogs Garage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Sleeping Dogs Garage</h1>
    <nav>
      <a href="login.html">Connexion</a>
      <a href="register.html">Inscription</a>
      <button id="logout-btn">Se déconnecter</button>
    </nav>
  </header>

  <main>
    <section class="add-vehicle-section">
      <h2>Ajouter un véhicule</h2>

      <form id="add-vehicle-form">
        <input type="text" id="name" placeholder="Nom du véhicule" required />
        <input type="text" id="category" placeholder="Catégorie" required />
        <input type="number" id="price" placeholder="Prix" />
        <input type="number" id="top_speed" placeholder="Vitesse max" />
        <input type="text" id="image_url" placeholder="URL de l'image" />
        <textarea id="description" placeholder="Description"></textarea>
        <button type="submit">Ajouter</button>
      </form>

      <p id="message"></p>
    </section>

    <section class="search-section">
      <input
        type="text"
        id="search-input"
        placeholder="Rechercher un véhicule par nom ou catégorie"/>
    </section>

    <section>
      <h2>Liste des véhicules</h2>
      <div id="vehicle-list"></div>
    </section>

    <div id="vehicle-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-modal" class="close-modal">&times;</button>
            <div id="modal-body">
            </div>
        </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
